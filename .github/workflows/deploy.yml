name: Deploy Finflow

on:
  push:
    branches: [main]
  workflow_dispatch:

# Define permissoes minimas para gerar a build e publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys simultaneos quando commits chegam em sequencia na main
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar projeto estatico
        run: npm run build

      - name: Configurar artefato do GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar pasta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
