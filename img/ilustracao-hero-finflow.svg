<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sombra suave para o cartão da janela principal -->
    <filter id="hero-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#17212B" flood-opacity="0.07" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#17212B" flood-opacity="0.04" />
    </filter>

    <!-- Gradiente suave da área do fluxo financeiro -->
    <linearGradient id="fluxo-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#76B8B2" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#DDF3EE" stop-opacity="0.04" />
    </linearGradient>

    <!-- Padrão sutil de fundo decorativo -->
    <pattern id="dot-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#E2EAE7" />
    </pattern>
  </defs>

  <!-- Padrão decorativo de apoio ao fundo da hero -->
  <rect x="0" y="0" width="620" height="420" fill="url(#dot-pattern)" opacity="0.6" rx="20" />
  <circle cx="530" cy="70" r="80" fill="#DDF3EE" opacity="0.6" />
  <circle cx="80" cy="350" r="60" fill="#F4F8F6" opacity="0.9" />

  <!-- Janela de visualização do aplicativo (mockup funcional limpo) -->
  <g filter="url(#hero-shadow)">
    <!-- Fundo da janela -->
    <rect x="35" y="30" width="550" height="360" rx="14" fill="#FFFFFF" stroke="#E2EAE7" stroke-width="1.5" />

    <!-- Barra superior da janela com controles e logo -->
    <path d="M 35 44 C 35 36.268 41.268 30 49 30 L 571 30 C 578.732 30 585 36.268 585 44 L 585 72 L 35 72 Z" fill="#F9FBFA" stroke="#E2EAE7" stroke-width="1.5" />
    <!-- Pontos decorativos da janela do sistema -->
    <circle cx="56" cy="51" r="4" fill="#D96868" opacity="0.8" />
    <circle cx="70" cy="51" r="4" fill="#F0C674" opacity="0.8" />
    <circle cx="84" cy="51" r="4" fill="#A9DDBA" opacity="0.8" />

    <!-- Mini branding dentro do mockup -->
    <rect x="108" y="47" width="14" height="5" rx="2.5" fill="#68B0A8" />
    <circle cx="110.5" cy="55.5" r="2.5" fill="#438B84" />
    <rect x="113" y="53" width="14" height="5" rx="2.5" fill="#A2DCBB" />
    <text x="134" y="56" font-family="'Playfair Display', serif" font-size="13" font-weight="700" fill="#17212B">Finflow</text>

    <!-- Badge 'PAINEL' à direita -->
    <rect x="495" y="43" width="68" height="20" rx="10" fill="#DDF3EE" />
    <text x="529" y="57" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#4D9690" text-anchor="middle">PAINEL</text>

    <!-- 3 Cartões de Métricas (Saldo, Receitas, Despesas) -->
    <!-- Card 1: Saldo atual -->
    <g transform="translate(55, 90)">
      <rect width="150" height="70" rx="8" fill="#F8FAFA" stroke="#E2EAE7" stroke-width="1" />
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#687775">Saldo atual</text>
      <text x="16" y="50" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#17212B">R$ 5.420,00</text>
      <circle cx="134" cy="22" r="4" fill="#76B8B2" />
    </g>

    <!-- Card 2: Receitas -->
    <g transform="translate(225, 90)">
      <rect width="150" height="70" rx="8" fill="#F8FAFA" stroke="#E2EAE7" stroke-width="1" />
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#687775">Receitas</text>
      <text x="16" y="50" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#329B76">R$ 6.800,00</text>
      <circle cx="134" cy="22" r="4" fill="#329B76" />
    </g>

    <!-- Card 3: Despesas -->
    <g transform="translate(395, 90)">
      <rect width="170" height="70" rx="8" fill="#F8FAFA" stroke="#E2EAE7" stroke-width="1" />
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#687775">Despesas</text>
      <text x="16" y="50" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#D96868">R$ 1.380,00</text>
      <circle cx="154" cy="22" r="4" fill="#D96868" />
    </g>

    <!-- Seção do Gráfico: Fluxo financeiro mensal -->
    <g transform="translate(55, 178)">
      <rect width="320" height="192" rx="8" fill="#FFFFFF" stroke="#E2EAE7" stroke-width="1" />
      <text x="18" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#17212B">Fluxo mensal</text>
      <text x="18" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#687775">Evolução do balanço nos últimos 6 meses</text>

      <!-- Linhas de grade suaves do gráfico -->
      <line x1="18" y1="70" x2="302" y2="70" stroke="#F0F4F2" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="18" y1="110" x2="302" y2="110" stroke="#F0F4F2" stroke-width="1" stroke-dasharray="3,3" />
      <line x1="18" y1="150" x2="302" y2="150" stroke="#F0F4F2" stroke-width="1" stroke-dasharray="3,3" />

      <!-- Área preenchida do fluxo financeiro -->
      <path d="M 22 145 C 50 145, 70 120, 100 125 C 130 130, 150 100, 180 115 C 210 130, 240 75, 270 85 C 285 90, 295 80, 302 85 L 302 165 L 22 165 Z" fill="url(#fluxo-gradient)" />

      <!-- Linha ondulada verde-água principal -->
      <path d="M 22 145 C 50 145, 70 120, 100 125 C 130 130, 150 100, 180 115 C 210 130, 240 75, 270 85 C 285 90, 295 80, 302 85" fill="none" stroke="#76B8B2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Pontos de destaque no gráfico -->
      <circle cx="100" cy="125" r="3.5" fill="#FFFFFF" stroke="#76B8B2" stroke-width="2" />
      <circle cx="180" cy="115" r="3.5" fill="#FFFFFF" stroke="#76B8B2" stroke-width="2" />
      <circle cx="270" cy="85" r="4" fill="#329B76" stroke="#FFFFFF" stroke-width="2" />

      <!-- Rótulos dos meses no eixo X -->
      <text x="25" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#99A6A3">Mai</text>
      <text x="80" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#99A6A3">Jun</text>
      <text x="135" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#99A6A3">Jul</text>
      <text x="190" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#99A6A3">Ago</text>
      <text x="245" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#99A6A3">Set</text>
      <text x="290" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#4D9690" font-weight="600">Out</text>
    </g>

    <!-- Seção de Últimas transações -->
    <g transform="translate(390, 178)">
      <rect width="175" height="192" rx="8" fill="#FFFFFF" stroke="#E2EAE7" stroke-width="1" />
      <text x="16" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#17212B">Últimas transações</text>

      <!-- Linha 1: Salário -->
      <g transform="translate(16, 44)">
        <circle cx="10" cy="12" r="10" fill="#DDF3EE" />
        <circle cx="10" cy="12" r="4" fill="#329B76" />
        <text x="26" y="12" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#17212B">Salário</text>
        <text x="26" y="23" font-family="system-ui, sans-serif" font-size="9" fill="#99A6A3">Hoje</text>
        <text x="144" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#329B76" text-anchor="end">+4.500</text>
      </g>
      <line x1="16" y1="78" x2="160" y2="78" stroke="#F4F8F6" stroke-width="1" />

      <!-- Linha 2: Mercado -->
      <g transform="translate(16, 88)">
        <circle cx="10" cy="12" r="10" fill="#FDF0F0" />
        <circle cx="10" cy="12" r="4" fill="#D96868" />
        <text x="26" y="12" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#17212B">Mercado</text>
        <text x="26" y="23" font-family="system-ui, sans-serif" font-size="9" fill="#99A6A3">Ontem</text>
        <text x="144" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#D96868" text-anchor="end">-185</text>
      </g>
      <line x1="16" y1="122" x2="160" y2="122" stroke="#F4F8F6" stroke-width="1" />

      <!-- Linha 3: Internet -->
      <g transform="translate(16, 132)">
        <circle cx="10" cy="12" r="10" fill="#FDF0F0" />
        <circle cx="10" cy="12" r="4" fill="#D96868" />
        <text x="26" y="12" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#17212B">Internet</text>
        <text x="26" y="23" font-family="system-ui, sans-serif" font-size="9" fill="#99A6A3">12 out.</text>
        <text x="144" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#D96868" text-anchor="end">-99</text>
      </g>
    </g>
  </g>
</svg>
