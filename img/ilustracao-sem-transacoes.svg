<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%" fill="none">
  <!-- Círculo suave de fundo -->
  <circle cx="160" cy="110" r="90" fill="#F4F8F6" />
  <circle cx="210" cy="70" r="28" fill="#DDF3EE" opacity="0.6" />
  <circle cx="110" cy="155" r="18" fill="#E2EAE7" opacity="0.5" />

  <!-- Carteira / Bloco de notas financeiro -->
  <g transform="translate(100, 50)">
    <!-- Sombra suave da base -->
    <ellipse cx="60" cy="120" rx="55" ry="8" fill="#17212B" opacity="0.06" />

    <!-- Corpo do bloco/carteira -->
    <rect x="15" y="15" width="90" height="95" rx="10" fill="#FFFFFF" stroke="#76B8B2" stroke-width="2" />
    <path d="M 15 25 C 15 19.477 19.477 15 25 15 L 105 15 L 105 38 L 15 38 Z" fill="#DDF3EE" />

    <!-- Marcador de topo -->
    <rect x="50" y="10" width="20" height="8" rx="3" fill="#4D9690" />

    <!-- Linhas suaves simulando transações a serem preenchidas -->
    <rect x="28" y="50" width="36" height="6" rx="3" fill="#E2EAE7" />
    <rect x="74" y="50" width="18" height="6" rx="3" fill="#A9DDBA" />

    <rect x="28" y="66" width="48" height="6" rx="3" fill="#E2EAE7" />
    <rect x="82" y="66" width="10" height="6" rx="3" fill="#E2EAE7" />

    <rect x="28" y="82" width="40" height="6" rx="3" fill="#E2EAE7" />
    <rect x="76" y="82" width="16" height="6" rx="3" fill="#76B8B2" opacity="0.6" />

    <!-- Moeda decorativa verde-água flutuando -->
    <g transform="translate(85, 30)">
      <circle cx="12" cy="12" r="14" fill="#76B8B2" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="12" cy="12" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2,2" />
      <text x="12" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">$</text>
    </g>

    <!-- Folha vegetal de crescimento financeiro -->
    <path d="M 20 100 C 10 90, 5 75, 10 65 C 20 70, 22 85, 20 100 Z" fill="#A9DDBA" opacity="0.8" />
    <path d="M 18 95 C 14 85, 12 78, 11 70" stroke="#4D9690" stroke-width="1" fill="none" />
  </g>
</svg>
